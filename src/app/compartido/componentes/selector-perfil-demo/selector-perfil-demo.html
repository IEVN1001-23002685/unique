<div class="selector-perfil">
  <span class="selector-perfil__etiqueta">Perfil de demostración</span>
  <div class="selector-perfil__opciones" role="group" aria-label="Perfil de demostración">
    <button
      type="button"
      class="selector-perfil__boton"
      [class.selector-perfil__boton--activo]="perfilDemo.perfil() === 'Operativo'"
      [attr.aria-pressed]="perfilDemo.perfil() === 'Operativo'"
      (click)="perfilDemo.seleccionar('Operativo')"
    >
      Operativo
    </button>
    <button
      type="button"
      class="selector-perfil__boton"
      [class.selector-perfil__boton--activo]="perfilDemo.perfil() === 'Administrador'"
      [attr.aria-pressed]="perfilDemo.perfil() === 'Administrador'"
      (click)="perfilDemo.seleccionar('Administrador')"
    >
      Administrador
    </button>
  </div>
  <small class="selector-perfil__nota">Solo cambia la visibilidad; no es autenticación.</small>
</div>
