<header class="barra-tienda sticky top-0 z-30 w-full bg-white">
  <nav
    class="mx-auto flex w-full max-w-[1264px] items-center justify-between gap-3 px-4 py-4 sm:px-6 sm:py-5 lg:px-[60px] lg:py-6"
    aria-label="Navegación principal"
  >
    <!-- Izquierda: el logotipo es el acceso al catálogo -->
    <a routerLink="/catalogo" class="barra-tienda__logo" aria-label="UNIQUE, ir al catálogo">
      @if (logoNoDisponible()) {
        <span class="logo-respaldo">
          <span class="logo-respaldo__nombre">UNIQUE</span>
          <span class="logo-respaldo__eslogan">— tan único como tú —</span>
        </span>
      } @else {
        <img
          src="/Logo1.png"
          alt="UNIQUE - tan unico como tu"
          class="barra-tienda__imagen"
          (error)="logoNoDisponible.set(true)"
        />
      }
    </a>

    <!-- Derecha: búsqueda de M03, carrito y accesos de cuenta según la sesión -->
    <div class="barra-tienda__acciones">
      <form class="barra-tienda__busqueda" role="search" (submit)="buscar($event)">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8" />
          <path d="m16 16 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
        <label class="sr-only" for="busqueda-tienda">Buscar productos en el catálogo</label>
        <input
          id="busqueda-tienda"
          type="search"
          autocomplete="off"
          placeholder="Buscar prendas"
          [value]="termino()"
          (input)="actualizarBusqueda($event)"
        />
        @if (termino()) {
          <button
            type="button"
            class="barra-tienda__busqueda-limpiar"
            aria-label="Limpiar búsqueda"
            (click)="limpiarBusqueda()"
          >
            ×
          </button>
        }
      </form>

      <a
        routerLink="/carrito"
        class="icono-barra icono-carrito"
        [attr.aria-label]="'Ir al carrito de compras, ' + totalArticulos() + ' productos'"
      >
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" class="icono-barra__svg">
          <path
            d="M3 4h2.2l2.3 10.1a2 2 0 0 0 1.95 1.55h7.6a2 2 0 0 0 1.95-1.55L20.5 8H6"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <circle cx="10" cy="20" r="1.4" fill="currentColor" />
          <circle cx="17.5" cy="20" r="1.4" fill="currentColor" />
        </svg>
        <span class="badge-carrito" aria-hidden="true">{{ totalArticulos() }}</span>
      </a>

      @if (autenticado()) {
        <a routerLink="/cuenta" class="cta-cuenta cta-cuenta--primario" (click)="cerrarMenu()">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" class="cta-cuenta__icono">
            <circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.8" />
            <path
              d="M5 20a7 7 0 0 1 14 0"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>
          <span class="cta-cuenta__texto">{{ nombreUsuario() }}</span>
        </a>
      } @else {
        <button
          type="button"
          class="cta-cuenta cta-cuenta--secundario"
          aria-label="Iniciar sesión"
          (click)="abrirInicioSesion()"
        >
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" class="cta-cuenta__icono">
            <circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.8" />
            <path
              d="M5 20a7 7 0 0 1 14 0"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>
          <span class="cta-cuenta__texto">Iniciar sesión</span>
        </button>
        <button
          type="button"
          class="cta-cuenta cta-cuenta--primario"
          aria-label="Registrarse"
          (click)="abrirRegistro()"
        >
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" class="cta-cuenta__icono">
            <circle cx="10" cy="8" r="3.5" stroke="currentColor" stroke-width="1.8" />
            <path
              d="M3.5 20a6.5 6.5 0 0 1 13 0"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
            <path
              d="M18.5 8v6M15.5 11h6"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>
          <span class="cta-cuenta__texto">Registrarse</span>
        </button>
      }

      <button
        type="button"
        class="icono-barra icono-menu"
        [attr.aria-expanded]="menuAbierto()"
        aria-controls="menu-tienda"
        aria-label="Menú de navegación"
        (click)="alternarMenu()"
      >
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" class="icono-barra__svg">
          <path
            d="M4 7h16M4 12h16M4 17h16"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </button>
    </div>
  </nav>

  @if (menuAbierto()) {
    <div id="menu-tienda" class="menu-movil">
      <div class="menu-movil__contenido">
        @if (autenticado()) {
          <a routerLink="/cuenta" class="enlace-menu" (click)="cerrarMenu()">{{ nombreUsuario() }}</a>
        } @else {
          <button type="button" class="enlace-menu" (click)="abrirInicioSesion()">
            Iniciar sesión
          </button>
          <button type="button" class="enlace-menu" (click)="abrirRegistro()">Registrarse</button>
        }
        <a routerLink="/carrito" class="enlace-menu" (click)="cerrarMenu()">
          Carrito ({{ totalArticulos() }})
        </a>
      </div>
    </div>
  }
</header>
