<header class="sticky top-0 z-30 w-full bg-white">
  <nav
    class="mx-auto grid w-full max-w-[1264px] grid-cols-[1fr_auto_1fr] items-center gap-4 px-4 py-5 sm:px-6 lg:px-[60px] lg:py-7"
    aria-label="Navegación principal"
  >
    <!-- Izquierda: acceso de cuenta (abre los modales de autenticacion) -->
    <div class="col-start-1 flex items-center gap-6 lg:gap-8">
      <button type="button" class="enlace-cuenta hidden lg:inline-flex" (click)="abrirRegistro()">
        Registrarse
      </button>
      <button
        type="button"
        class="enlace-cuenta hidden lg:inline-flex"
        (click)="abrirInicioSesion()"
      >
        Iniciar sesión
      </button>
    </div>

    <!-- Centro: logotipo -->
    <a
      routerLink="/catalogo"
      class="col-start-2 justify-self-center"
      aria-label="UNIQUE, ir al catálogo"
    >
      @if (logoNoDisponible()) {
        <span class="logo-respaldo">
          <span class="logo-respaldo__nombre">UNIQUE</span>
          <span class="logo-respaldo__eslogan">— tan único como tú —</span>
        </span>
      } @else {
        <img
          src="/Logo1.png"
          alt="UNIQUE - tan unico como tu"
          class="block h-auto w-[140px] sm:w-[170px]"
          (error)="logoNoDisponible.set(true)"
        />
      }
    </a>

    <!-- Derecha: catálogo, buscador, carrito y menú -->
    <div class="col-start-3 flex items-center justify-end gap-3 sm:gap-5">
      <a
        routerLink="/catalogo"
        routerLinkActive="enlace-activo"
        class="enlace-cuenta hidden lg:inline-flex"
      >
        Catálogo
      </a>
      <!-- Acceso de demostración al panel; el control real de roles se hará en Flask. -->
      <a routerLink="/panel" class="enlace-cuenta hidden lg:inline-flex"> Panel </a>

    

      <!-- Carrito: se navegará cuando exista el módulo de carrito -->
      <button type="button" class="icono-barra" aria-label="Carrito de compras">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" class="h-6 w-6">
          <path
            d="M3 4h2.2l2.3 10.1a2 2 0 0 0 1.95 1.55h7.6a2 2 0 0 0 1.95-1.55L20.5 8H6"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <circle cx="10" cy="20" r="1.4" fill="currentColor" />
          <circle cx="17.5" cy="20" r="1.4" fill="currentColor" />
        </svg>
      </button>

      <button
        type="button"
        class="icono-barra lg:hidden"
        [attr.aria-expanded]="menuAbierto()"
        aria-controls="menu-tienda"
        aria-label="Menú de navegación"
        (click)="alternarMenu()"
      >
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" class="h-6 w-6">
          <path
            d="M4 7h16M4 12h16M4 17h16"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </button>
    </div>
  </nav>

  @if (menuAbierto()) {
    <div
      id="menu-tienda"
      class="lg:hidden border-t border-neutral-200 bg-white px-4 py-5 sm:px-6"
    >
      <div class="mx-auto flex w-full max-w-[1264px] flex-col items-start gap-4">
        <!-- Enlaces del menú para tablet y celular -->
        <a routerLink="/catalogo" class="enlace-menu" (click)="cerrarMenu()">Catálogo</a>
        <a routerLink="/panel" class="enlace-menu" (click)="cerrarMenu()">Panel</a>
        <button type="button" class="enlace-menu" (click)="abrirInicioSesion()">
          Iniciar sesión
        </button>
        <button type="button" class="enlace-menu" (click)="abrirRegistro()">Registrarse</button>
      </div>
    </div>
  }
</header>
