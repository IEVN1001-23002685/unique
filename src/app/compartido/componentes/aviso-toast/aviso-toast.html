@if (avisos.aviso(); as aviso) {
  <div class="aviso" [attr.data-tipo]="aviso.tipo" role="status" aria-live="polite">
    <span class="aviso__punto" aria-hidden="true"></span>
    <p class="aviso__texto">{{ aviso.mensaje }}</p>
    <button type="button" class="aviso__cerrar" aria-label="Cerrar aviso" (click)="avisos.cerrar()">
      ×
    </button>
  </div>
}
