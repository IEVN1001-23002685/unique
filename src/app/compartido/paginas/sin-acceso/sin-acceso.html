<main class="pagina-estado">
  <section class="tarjeta pagina-estado__tarjeta" aria-labelledby="titulo-sin-acceso">
    <p class="pagina-estado__codigo">403</p>
    <h1 id="titulo-sin-acceso" class="titulo">Sin acceso a esta sección</h1>
    <p class="subtitulo">
      Tu rol es <strong>{{ perfil }}</strong> y esta pantalla requiere
      <strong>{{ requerido }}</strong>. El acceso lo decide el token real emitido por Flask.
    </p>
    <p class="nota">Ruta solicitada: <span class="mono">{{ destino }}</span></p>
    <div class="pagina-estado__acciones">
      <button type="button" class="boton boton--primario" (click)="volver()">Volver</button>
      <a routerLink="/catalogo" class="boton boton--secundario">Ir a la tienda</a>
      <a routerLink="/login" class="boton boton--secundario">Ir a iniciar sesión</a>
    </div>
  </section>
</main>
