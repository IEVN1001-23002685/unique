<div class="recuperacion">
  <div class="recuperacion__tarjeta">
    <button
      type="button"
      aria-label="Cerrar recuperación"
      (click)="onCerrar()"
      class="recuperacion__cerrar"
    >
      ✕
    </button>

    <div class="recuperacion__encabezado">
      <img src="/Logo1.png" alt="UNIQUE - tan único como tú" class="recuperacion__logo" />
      <h2 class="recuperacion__titulo">Recuperar contraseña</h2>
    </div>

    <form class="recuperacion__formulario" (ngSubmit)="onSubmit()" [formGroup]="formulario">
      <div class="recuperacion__campo">
        <label for="recCorreo" class="recuperacion__etiqueta"> Correo electrónico: </label>
        <input
          id="recCorreo"
          formControlName="correo"
          type="email"
          placeholder="tucorreo@ejemplo.com"
          class="recuperacion__entrada"
        />
        @if (errorEnCorreo()) {
          <p class="recuperacion__error">Escribe un correo electrónico válido.</p>
        }
      </div>

      <button type="submit" class="recuperacion__boton" [disabled]="cargando">
        {{ cargando ? 'Enviando…' : 'Generar instrucción' }}
      </button>
      @if (mensaje) {
        <p class="recuperacion__error">{{ mensaje }}</p>
      }
    </form>

    @if (enviado) {
      <div class="recuperacion__respuesta">
        <p class="recuperacion__respuesta-texto">{{ mensajeFijo }}</p>
        <p class="recuperacion__respuesta-aviso">
          La vigencia de la instrucción es de 30 minutos.
        </p>
      </div>
    }

    <p class="recuperacion__pie">
      <button type="button" class="recuperacion__enlace" (click)="onVolverALogin()">
        Volver a Iniciar Sesión
      </button>
    </p>
  </div>
</div>
