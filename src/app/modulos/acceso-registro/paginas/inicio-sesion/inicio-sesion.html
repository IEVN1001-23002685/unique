<div class="autenticacion">
  <button
    type="button"
    class="autenticacion__cerrar"
    aria-label="Cerrar inicio de sesion"
    (click)="onCerrar()"
  >
    ✕
  </button>

  <div class="autenticacion__encabezado">
    <img src="/Logo1.png" alt="UNIQUE - tan unico como tu" class="autenticacion__logo" />
    <h2 class="autenticacion__titulo">Iniciar Sesión</h2>
  </div>

  <form class="autenticacion__formulario" (ngSubmit)="onSubmit()" [formGroup]="formulario">
    <div class="autenticacion__campo">
      <label class="autenticacion__etiqueta" for="loginCorreo">Correo electrónico:</label>
      <input
        id="loginCorreo"
        formControlName="correo"
        type="email"
        autofocus
        class="autenticacion__entrada"
      />
      @if (errorEn('correo')) {
        <p class="autenticacion__error">Escribe un correo electrónico válido.</p>
      }
    </div>

    <div class="autenticacion__campo">
      <label class="autenticacion__etiqueta" for="loginContrasena">Contraseña:</label>
      <input
        id="loginContrasena"
        formControlName="contrasena"
        type="password"
        class="autenticacion__entrada"
      />
      @if (errorEn('contrasena')) {
        <p class="autenticacion__error">Escribe tu contraseña.</p>
      }
    </div>

    <button type="submit" class="autenticacion__boton">Iniciar Sesión</button>
  </form>

  @if (mensaje) {
    <p class="autenticacion__aviso" role="status">{{ mensaje }}</p>
  }

  <p class="autenticacion__pie">
    <button type="button" class="autenticacion__enlace" (click)="onOlvidarContrasena()">
      Olvidé mi contraseña
    </button>
    <span aria-hidden="true"> · </span>
    ¿Aún no estás registrado?
    <button type="button" class="autenticacion__enlace" (click)="onIrARegistro()">
      Regístrate
    </button>
  </p>
</div>
