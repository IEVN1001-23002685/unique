<nav class="pestanas" aria-label="Pantallas de productos">
  <a
    routerLink="/admin/productos"
    routerLinkActive="pestana--activa"
    [routerLinkActiveOptions]="{ exact: true }"
    class="pestana"
  >
    Catálogo maestro
  </a>
  <a
    routerLink="/admin/productos/nuevas"
    routerLinkActive="pestana--activa"
    [class.pestana--activa]="activo() === 'nuevas'"
    class="pestana"
  >
    Nuevas
  </a>
  <a
    routerLink="/admin/productos/categorias"
    routerLinkActive="pestana--activa"
    [class.pestana--activa]="activo() === 'categorias'"
    class="pestana"
  >
    Categorías
  </a>
  <a
    routerLink="/admin/productos/imagenes"
    routerLinkActive="pestana--activa"
    [class.pestana--activa]="activo() === 'imagenes'"
    class="pestana"
  >
    Imágenes
  </a>
  <a
    routerLink="/admin/productos/nuevo"
    routerLinkActive="pestana--activa"
    [class.pestana--activa]="activo() === 'nuevo'"
    class="pestana"
  >
    Nuevo producto
  </a>
  <a
    routerLink="/admin/productos/variantes"
    routerLinkActive="pestana--activa"
    class="pestana"
  >
    Variantes
  </a>
</nav>
