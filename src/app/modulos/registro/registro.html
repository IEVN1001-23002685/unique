<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
  <div style="position: relative; width: 100%; max-width: 480px; background-color: #e6cce8; border-radius: 28px; padding: 28px 36px 24px; box-shadow: 0 12px 30px rgba(66, 33, 75, 0.14); color: #3b2d3e;">
    
    <!-- Botón cerrar -->
    <button
      type="button"
      aria-label="Cerrar registro"
      (click)="onCerrar()"
      style="position: absolute; top: 18px; left: 18px; width: 34px; height: 34px; border-radius: 50%; border: 2px solid #2b212d; background-color: #ffffff; color: #2b212d; font-size: 16px; font-weight: bold; cursor: pointer;"
    >
      ✕
    </button>

    <!-- Encabezado / Logo -->
    <div style="text-align: center; margin-top: 16px; margin-bottom: 18px;">
      <img
        src="/Logo1.png"
        alt="UNIQUE - tan único como tú"
        style="display: block; max-width: 210px; width: 100%; height: auto; margin: 0 auto 8px;"
      />
      <h2 style="margin: 0; font-size: 26px; font-weight: 700; color: #332736;">Registro</h2>
    </div>

    <!-- Formulario -->
    <form (ngSubmit)="onSubmit()" #registroForm="ngForm" style="display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; flex-direction: column; gap: 5px;">
        <label for="nombreCompleto" style="font-size: 13px; font-weight: 600; color: #2f2432; padding-left: 4px;">Nombre completo:</label>
        <input
          id="nombreCompleto"
          name="nombreCompleto"
          type="text"
          [(ngModel)]="usuario.nombreCompleto"
          required
          style="height: 40px; border: none; border-radius: 999px; background-color: #f3ecf4; padding: 0 16px; font-size: 14px; color: #2b212d; outline: none;"
        />
      </div>

      <div style="display: flex; flex-direction: column; gap: 5px;">
        <label for="telefono" style="font-size: 13px; font-weight: 600; color: #2f2432; padding-left: 4px;">Teléfono:</label>
        <input
          id="telefono"
          name="telefono"
          type="tel"
          [(ngModel)]="usuario.telefono"
          required
          style="height: 40px; border: none; border-radius: 999px; background-color: #f3ecf4; padding: 0 16px; font-size: 14px; color: #2b212d; outline: none;"
        />
      </div>

      <div style="display: flex; flex-direction: column; gap: 5px;">
        <label for="correo" style="font-size: 13px; font-weight: 600; color: #2f2432; padding-left: 4px;">Correo electrónico:</label>
        <input
          id="correo"
          name="correo"
          type="email"
          [(ngModel)]="usuario.correo"
          required
          style="height: 40px; border: none; border-radius: 999px; background-color: #f3ecf4; padding: 0 16px; font-size: 14px; color: #2b212d; outline: none;"
        />
      </div>

      <div style="display: flex; flex-direction: column; gap: 5px;">
        <label for="contrasena" style="font-size: 13px; font-weight: 600; color: #2f2432; padding-left: 4px;">Contraseña</label>
        <input
          id="contrasena"
          name="contrasena"
          type="password"
          [(ngModel)]="usuario.contrasena"
          required
          style="height: 40px; border: none; border-radius: 999px; background-color: #f3ecf4; padding: 0 16px; font-size: 14px; color: #2b212d; outline: none;"
        />
      </div>

      <div style="display: flex; flex-direction: column; gap: 5px;">
        <label for="repetirContrasena" style="font-size: 13px; font-weight: 600; color: #2f2432; padding-left: 4px;">Repetir contraseña:</label>
        <input
          id="repetirContrasena"
          name="repetirContrasena"
          type="password"
          [(ngModel)]="usuario.repetirContrasena"
          required
          style="height: 40px; border: none; border-radius: 999px; background-color: #f3ecf4; padding: 0 16px; font-size: 14px; color: #2b212d; outline: none;"
        />
      </div>

      <button
        type="submit"
        style="margin: 10px auto 4px; width: 72%; height: 44px; border: none; border-radius: 999px; background-color: #4f2857; color: #ffffff; font-size: 16px; font-weight: 600; cursor: pointer;"
      >
        Registrarse
      </button>
    </form>

    <p style="margin: 12px 0 0; text-align: center; font-size: 12px; color: #3b2d3e;">
      ¿Ya estas registrado?
      <a href="javascript:void(0)" (click)="onIrAIniciarSesion()" style="color: #4f2857; font-weight: 700; text-decoration: none;">
        Iniciar Sesión
      </a>
    </p>
  </div>
</div>
